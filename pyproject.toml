[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keno-bot"
version = "0.1.0"
description = "Local, replayable Stake-style Keno research engine"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
ws = ["websockets>=12"]

[project.scripts]
keno = "keno.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
